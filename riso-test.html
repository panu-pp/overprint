<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Riso Render Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2a2630;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--font-body)}
  #wrap{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}
  #hud .riso-card{padding:6px 10px;font-weight:700;font-size:13px}
  #fps{font-family:var(--font-body)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="riso-card y riso-grain" style="font-family:var(--font-display)">RISO TEST</div>
    <div class="riso-card paper riso-grain" id="fps">-- fps</div>
  </div>
</div>
<script src="riso.js"></script>
<script>
(function(){
  Riso.applyCss();
  var dpr = Math.min(3, window.devicePixelRatio || 1);
  var t0 = performance.now(); Riso.init(dpr);
  console.log('Riso.init ms', (performance.now() - t0).toFixed(1));

  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 0, H = 0;
  function resize(){
    var r = cv.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  window.addEventListener('resize', resize); resize();

  var KEYS = ['R','Y','B'];
  var board = [];
  for (var i = 0; i < 64; i++) {
    var v = Math.random();
    board.push(v < 0.4 ? null : v < 0.47 ? 'X' : KEYS[(Math.random()*3)|0]);
  }
  // full row 5 -> highlight demo
  for (var c = 0; c < 8; c++) board[5*8+c] = board[5*8+c] || 'Y';
  var ghost = [[0,0],[0,1],[1,1],[2,1]], ghostAt = [1, 4];
  var tray = [
    { cells: [[0,0],[0,1],[0,2],[1,1]], key: 'R' },
    { cells: [[0,0],[1,0],[1,1]], key: 'Y' },
    { cells: [[0,0],[0,1],[1,0],[1,1]], key: 'B' }
  ];
  var praise = ['NICE!','INKY!','+120','COMBO x3','SPLAT!'];

  function layout(){
    var s = Math.floor((W - 32) / 8);
    return { s: s, bx: (W - s*8)/2, by: H*0.18 };
  }

  cv.addEventListener('pointerdown', function(e){
    var r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    var k = KEYS[(Math.random()*3)|0];
    Riso.burst(x, y, k, 18);
    Riso.popText(x, y - 10, praise[(Math.random()*praise.length)|0], k, 30);
    Riso.shake(8);
    var L = layout(), col = Math.floor((x - L.bx)/L.s), row = Math.floor((y - L.by)/L.s);
    if (col >= 0 && col < 8 && row >= 0 && row < 8) board[row*8+col] = board[row*8+col] ? null : k;
  });

  var last = performance.now(), frames = 0, fpsT = last, fpsEl = document.getElementById('fps');
  function loop(now){
    var dt = (now - last)/1000; last = now;
    frames++; if (now - fpsT > 500) { fpsEl.textContent = Math.round(frames*1000/(now-fpsT)) + ' fps'; frames = 0; fpsT = now; }
    var sh = Riso.getShake();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    Riso.drawPaper(ctx, W, H, now);
    ctx.translate(sh.x, sh.y);
    var L = layout(), s = L.s;
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      var x = L.bx + c*s, y = L.by + r*s, k = board[r*8+c], seed = r*8+c;
      Riso.drawEmpty(ctx, x, y, s, { t: now, seed: seed });
      if (k) Riso.drawCell(ctx, x, y, s, k, {
        t: now, seed: seed,
        highlight: r === 5,
        selected: r === 7 && c === 2,
        mark: (r === 0 && c === 7) ? '★' : null
      });
    }
    for (var g = 0; g < ghost.length; g++) {
      var gr = ghostAt[0] + ghost[g][0], gc = ghostAt[1] + ghost[g][1];
      Riso.drawCell(ctx, L.bx + gc*s, L.by + gr*s, s, 'B', { t: now, seed: g, ghost: true });
    }
    // tray
    var ty = L.by + s*8 + s*1.6;
    for (var i = 0; i < 3; i++) {
      Riso.drawPieceIcon(ctx, tray[i].cells, W*(i+1)/4, ty, s*0.7, tray[i].key, now);
    }
    // caption
    ctx.fillStyle = Riso.palette.dark;
    ctx.font = '14px ' + Riso.fonts.body;
    ctx.textAlign = 'center';
    ctx.fillText('tap anywhere: burst + popText + shake', W/2, H - 24);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    Riso.drawFx(ctx, now, dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
